apiVersion: v1
kind: Namespace
metadata:
  name: jeeves
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jeeves
  namespace: jeeves
  annotations:
    iam.gke.io/gcp-service-account: jeeves-runtime@consummate-atom-503516-h4.iam.gserviceaccount.com
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jeeves-deployer
  namespace: jeeves
rules:
  - apiGroups: [""]
    resources: [services]
    verbs: [get, create, patch, update]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, create, patch, update]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [jeeves-env]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jeeves-deployer
  namespace: jeeves
subjects:
  - kind: User
    name: jeeves-ci@consummate-atom-503516-h4.iam.gserviceaccount.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: jeeves-deployer
  apiGroup: rbac.authorization.k8s.io
